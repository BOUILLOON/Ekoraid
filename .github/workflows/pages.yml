# Copier dans .github/workflows/pages.yml. Exécution volontaire seulement.
name: Publier le site invités
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire seulement les ressources publiques
        env:
          PLAYLIST_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PLAYLIST_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
        run: python cloud/build_pages.py --url "$PLAYLIST_SUPABASE_URL" --public-key "$PLAYLIST_PUBLIC_KEY" --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
